<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 246" role="img" aria-label="A market maker and a user interface each hand a signed order to Skew, which relays the maker order and then the user order to the HyperCore outcome book, where the trade creates HIP-4 positions" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect x="14" y="24" width="184" height="72" rx="8" fill="#f6f7f9" stroke="#c5cad3"/><text x="106.0" y="56.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">Market maker</text><text x="106.0" y="73.5" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">signed post-only quotes</text><rect x="14" y="150" width="184" height="72" rx="8" fill="#f6f7f9" stroke="#c5cad3"/><text x="106.0" y="182.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">User interface</text><text x="106.0" y="199.5" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">signed limit order</text><rect x="266" y="87" width="164" height="72" rx="8" fill="#f6f7f9" stroke="#c5cad3"/><text x="348.0" y="119.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">Skew</text><text x="348.0" y="136.5" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">holds, matches, relays</text><rect x="600" y="87" width="196" height="72" rx="8" fill="#fbf0e6" stroke="#d9a77d"/><text x="698.0" y="119.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">HyperCore outcome book</text><text x="698.0" y="136.5" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">trade between the two accounts</text><rect x="840" y="87" width="146" height="72" rx="8" fill="#f6f7f9" stroke="#c5cad3"/><text x="913.0" y="119.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">HIP-4 positions</text><text x="913.0" y="136.5" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">settled on Hyperliquid</text><path d="M201,60 L232,60 L232,108 L263,108" stroke-width="1.4" fill="none" stroke="#5d6470"/><polygon points="263,108 255.0,112.0 255.0,104.0" fill="#5d6470" stroke="none"/><path d="M201,186 L232,186 L232,138 L263,138" stroke-width="1.4" fill="none" stroke="#5d6470"/><polygon points="263,138 255.0,142.0 255.0,134.0" fill="#5d6470" stroke="none"/><path d="M433,123 L597,123" stroke-width="1.4" fill="none" stroke="#a85a24"/><polygon points="597,123 589.0,127.0 589.0,119.0" fill="#a85a24" stroke="none"/><text x="515" y="113" text-anchor="middle" font-size="11" font-weight="400" fill="#a85a24">maker order, then user order</text><path d="M799,123 L837,123" stroke-width="1.4" fill="none" stroke="#5d6470"/><polygon points="837,123 829.0,127.0 829.0,119.0" fill="#5d6470" stroke="none"/></svg>