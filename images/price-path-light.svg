<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 284" role="img" aria-label="An index print passes through the data proxy, the oracle program and the oracle updater to HyperCore, and the SHCU order book feeds impact prices back to the oracle program" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect x="14" y="24" width="156" height="84" rx="8" fill="#f6f7f9" stroke="#c5cad3"/><text x="92.0" y="55.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">Price Index SG</text><text x="92.0" y="72.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">index ticks,</text><text x="92.0" y="87.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">up to 2 a second</text><rect x="198" y="24" width="156" height="84" rx="8" fill="#f6f7f9" stroke="#c5cad3"/><text x="276.0" y="55.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">Scape data proxy</text><text x="276.0" y="72.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">adds receipt time</text><text x="276.0" y="87.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">and market status</text><path d="M173,66.0 L195,66.0" stroke-width="1.4" fill="none" stroke="#5d6470"/><polygon points="195,66.0 187.0,70.0 187.0,62.0" fill="#5d6470" stroke="none"/><rect x="382" y="24" width="156" height="84" rx="8" fill="#fbf0e6" stroke="#d9a77d"/><text x="460.0" y="55.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">SEDA oracle program</text><text x="460.0" y="72.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">oracle, mark candidates,</text><text x="460.0" y="87.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">metadata</text><path d="M357,66.0 L379,66.0" stroke-width="1.4" fill="none" stroke="#5d6470"/><polygon points="379,66.0 371.0,70.0 371.0,62.0" fill="#5d6470" stroke="none"/><rect x="566" y="24" width="156" height="84" rx="8" fill="#f6f7f9" stroke="#c5cad3"/><text x="644.0" y="55.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">Oracle updater</text><text x="644.0" y="72.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">setOracle about</text><text x="644.0" y="87.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">every 3 s</text><path d="M541,66.0 L563,66.0" stroke-width="1.4" fill="none" stroke="#5d6470"/><polygon points="563,66.0 555.0,70.0 555.0,62.0" fill="#5d6470" stroke="none"/><rect x="750" y="24" width="156" height="84" rx="8" fill="#f6f7f9" stroke="#c5cad3"/><text x="828.0" y="55.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">HyperCore</text><text x="828.0" y="72.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">mark, funding,</text><text x="828.0" y="87.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">margin, liquidation</text><path d="M725,66.0 L747,66.0" stroke-width="1.4" fill="none" stroke="#5d6470"/><polygon points="747,66.0 739.0,70.0 739.0,62.0" fill="#5d6470" stroke="none"/><rect x="566" y="196" width="156" height="64" rx="8" fill="#f6f7f9" stroke="#c5cad3"/><text x="644.0" y="224.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1f24">SHCU order book</text><text x="644.0" y="241.5" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">impact prices, mid</text><path d="M828.0,111 L828.0,228.0 L725,228.0" stroke-width="1.4" fill="none" stroke="#5d6470"/><polygon points="725,228.0 733.0,224.0 733.0,232.0" fill="#5d6470" stroke="none"/><text x="769.0" y="220.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">trades</text><path d="M563,228.0 L460.0,228.0 L460.0,111" stroke-width="1.4" fill="none" stroke="#a85a24"/><polygon points="460.0,111 464.0,119.0 456.0,119.0" fill="#a85a24" stroke="none"/><text x="513.0" y="220.0" text-anchor="middle" font-size="11" font-weight="400" fill="#a85a24">impact prices</text><text x="513.0" y="246.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5d6470">when Shanghai is closed</text></svg>