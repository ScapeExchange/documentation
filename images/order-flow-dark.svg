<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 246" role="img" aria-label="A market maker and a user interface each hand a signed order to Skew, which relays the maker order and then the user order to the HyperCore outcome book, where the trade creates HIP-4 positions" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect x="14" y="24" width="184" height="72" rx="8" fill="#17191d" stroke="#3b4049"/><text x="106.0" y="56.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e9ec">Market maker</text><text x="106.0" y="73.5" text-anchor="middle" font-size="11" font-weight="400" fill="#9299a5">signed post-only quotes</text><rect x="14" y="150" width="184" height="72" rx="8" fill="#17191d" stroke="#3b4049"/><text x="106.0" y="182.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e9ec">User interface</text><text x="106.0" y="199.5" text-anchor="middle" font-size="11" font-weight="400" fill="#9299a5">signed limit order</text><rect x="266" y="87" width="164" height="72" rx="8" fill="#17191d" stroke="#3b4049"/><text x="348.0" y="119.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e9ec">Skew</text><text x="348.0" y="136.5" text-anchor="middle" font-size="11" font-weight="400" fill="#9299a5">holds, matches, relays</text><rect x="600" y="87" width="196" height="72" rx="8" fill="#2b2018" stroke="#7a5233"/><text x="698.0" y="119.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e9ec">HyperCore outcome book</text><text x="698.0" y="136.5" text-anchor="middle" font-size="11" font-weight="400" fill="#9299a5">trade between the two accounts</text><rect x="840" y="87" width="146" height="72" rx="8" fill="#17191d" stroke="#3b4049"/><text x="913.0" y="119.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e7e9ec">HIP-4 positions</text><text x="913.0" y="136.5" text-anchor="middle" font-size="11" font-weight="400" fill="#9299a5">settled on Hy